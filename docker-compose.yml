services:
  mysql:
    image: mysql:8.4
    container_name: medlab-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-medlab}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-medlab}
      MYSQL_USER: ${MYSQL_USER:-medlab}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-medlab}
    ports:
      - '${MYSQL_PORT:-3307}:3306'
    volumes:
      - medlab-mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${MYSQL_ROOT_PASSWORD:-medlab}']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  medlab-mysql-data:
