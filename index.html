<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The favicon can only follow the OS preference — it cannot see the in-app `.dark`
      class, so it will not track the header toggle. That is inherent to favicons, not a
      bug to fix. Order matters: on a dark-preferring OS the second link wins; otherwise
      it does not match and the first applies.
    -->
    <link rel="icon" type="image/png" href="/medlab-light.png" />
    <link rel="icon" type="image/png" href="/medlab-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/medlab-light.png" />
    <title>Médiku Labarik (MédLab) — Child Health AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {}
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@700&family=Baumans&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
